<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DongAI</title>
<style>
  html,body{height:100%;margin:0;background:#0f1115;color:#e6e8ee;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .logo{font-size:34px;font-weight:600;letter-spacing:2px}
  .bar{width:240px;height:4px;border-radius:2px;background:#232733;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#6c8cff;border-radius:2px;animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  .msg{font-size:15px}
  .hint{font-size:12px;color:#8a90a2}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">DongAI</div>
  <div class="bar"><i></i></div>
  <div class="msg" id="msg">正在启动…</div>
  <div class="hint" id="hint">首次启动需要初始化本地数据库，可能需要十几秒</div>
</div>
<script>
  var q = new URLSearchParams(location.search)
  if (q.get('msg')) document.getElementById('msg').textContent = q.get('msg')
  if (q.get('hint')) document.getElementById('hint').textContent = q.get('hint')
</script>
</body>
</html>
